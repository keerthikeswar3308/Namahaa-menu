<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B027"/>
      <stop offset="50%" stop-color="#E6A12A"/>
      <stop offset="100%" stop-color="#D98A00"/>
    </linearGradient>
  </defs>

  <!-- Deep Emerald Outer Circle Base -->
  <circle cx="150" cy="150" r="144" fill="#002E2B"/>

  <!-- Thick Outer Solid Golden Ring -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="url(#goldGradCircle)" stroke-width="8"/>

  <!-- Inner Thin Accent Ring -->
  <circle cx="150" cy="150" r="130" fill="none" stroke="url(#goldGradCircle)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- PURE VEG Arc Text Top -->
  <path id="textArcTop" d="M 50,150 A 100,100 0 1,1 250,150" fill="none"/>
  <text font-family="'Outfit', sans-serif" font-size="10" font-weight="900" fill="url(#goldGradCircle)" letter-spacing="3">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      PURE VEG • 100% GHEE
    </textPath>
  </text>

  <!-- Central Brand Title Group -->
  <g transform="translate(150, 145)" text-anchor="middle">
    
    <!-- Traditional Diya / Flame Top Motif (No namaste emoji) -->
    <g transform="translate(0, -50)">
      <path d="M 0,-18 C 6,-10 10,-4 10,4 C 10,10 5,15 0,15 C -5,15 -10,10 -10,4 C -10,-4 -6,-10 0,-18 Z" fill="url(#goldGradCircle)"/>
      <circle cx="0" cy="2" r="3.5" fill="#002E2B"/>
      <path d="M -16,14 Q 0,22 16,14 Q 0,26 -16,14 Z" fill="url(#goldGradCircle)"/>
    </g>

    <!-- NAMAHAA Main Text with Normal Letters -->
    <text y="5" font-family="'Outfit', 'Montserrat', sans-serif" font-size="28" font-weight="900" fill="url(#goldGradCircle)" letter-spacing="4">
      NAMAHAA
    </text>

    <!-- Horizontal Divider Line -->
    <line x1="-80" y1="12" x2="80" y2="12" stroke="url(#goldGradCircle)" stroke-width="2"/>

    <!-- TIFFIN ROOM Subtitle -->
    <text y="32" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-weight="700" fill="url(#goldGradCircle)" letter-spacing="5">
      TIFFIN ROOM
    </text>
  </g>
</svg>
