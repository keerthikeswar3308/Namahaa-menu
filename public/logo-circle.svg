<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B027"/>
      <stop offset="50%" stop-color="#E6A12A"/>
      <stop offset="100%" stop-color="#D98A00"/>
    </linearGradient>
  </defs>

  <!-- Deep Emerald Outer Circle Base -->
  <circle cx="150" cy="150" r="144" fill="#002E2B"/>

  <!-- Thick Outer Solid Golden Ring -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="url(#goldGradCircle)" stroke-width="8"/>

  <!-- Inner Thin Accent Ring -->
  <circle cx="150" cy="150" r="130" fill="none" stroke="url(#goldGradCircle)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- PURE VEG Arc Text Top -->
  <path id="textArcTop" d="M 50,150 A 100,100 0 1,1 250,150" fill="none"/>
  <text font-family="'Outfit', sans-serif" font-size="10" font-weight="900" fill="url(#goldGradCircle)" letter-spacing="3">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      PURE VEG • 100% GHEE
    </textPath>
  </text>

  <!-- Central Namaste Icon & Brand Title -->
  <g transform="translate(150, 155)" text-anchor="middle">
    
    <!-- Central Namaste Hands Icon -->
    <g transform="translate(-30, -78) scale(0.65)">
      <path d="M 12,92 C 16,72 26,45 38,20 Q 45,8 48,0 C 48,0 45,28 35,52 C 27,70 24,92 24,92 Z" fill="url(#goldGradCircle)"/>
      <path d="M 0,92 C 4,75 14,52 24,32 C 30,20 38,8 42,0 C 42,0 37,25 29,48 C 21,68 12,92 12,92 Z" fill="url(#goldGradCircle)"/>
      <path d="M 84,92 C 80,72 70,45 58,20 Q 51,8 48,0 C 48,0 51,28 61,52 C 69,70 72,92 72,92 Z" fill="url(#goldGradCircle)"/>
      <path d="M 96,92 C 92,75 82,52 72,32 C 66,20 58,8 54,0 C 54,0 59,25 67,48 C 75,68 84,92 84,92 Z" fill="url(#goldGradCircle)"/>
      <path d="M -4,92 Q 48,114 100,92 L 90,78 Q 48,96 6,78 Z" fill="url(#goldGradCircle)"/>
    </g>

    <!-- NAMAHAA Main Text -->
    <text y="5" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" fill="url(#goldGradCircle)" letter-spacing="4">
      NAMAHAA
    </text>

    <!-- Horizontal Divider Line -->
    <line x1="-80" y1="12" x2="80" y2="12" stroke="url(#goldGradCircle)" stroke-width="2"/>

    <!-- TIFFIN ROOM Subtitle -->
    <text y="32" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-weight="700" fill="url(#goldGradCircle)" letter-spacing="5">
      TIFFIN ROOM
    </text>
  </g>
</svg>
