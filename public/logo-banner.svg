<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B027"/>
      <stop offset="50%" stop-color="#E6A12A"/>
      <stop offset="100%" stop-color="#D98A00"/>
    </linearGradient>
    <filter id="goldDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#F5B027" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Deep Emerald Green Background Box -->
  <rect x="0" y="0" width="800" height="240" fill="#002E2B"/>

  <!-- Outer Solid Golden Border -->
  <rect x="10" y="10" width="780" height="220" fill="none" stroke="url(#goldGradient)" stroke-width="12"/>

  <!-- Top Right "PURE VEG" Text -->
  <text x="765" y="42" font-family="'Outfit', 'Montserrat', 'Helvetica', sans-serif" font-size="13" font-weight="900" fill="url(#goldGradient)" text-anchor="end" letter-spacing="2.5">
    PURE VEG
  </text>

  <!-- Main Banner Brand Logo Group -->
  <g transform="translate(68, 62)">
    
    <!-- Letter N -->
    <path d="M 0,90 L 0,15 L 12,15 L 60,78 L 60,15 L 72,15 L 72,90 L 60,90 L 12,27 L 12,90 Z" fill="url(#goldGradient)"/>

    <!-- Letter A (Namaste / Folded Palms Icon) -->
    <g transform="translate(76, -2)">
      <!-- Left Folded Palm -->
      <path d="M 12,92 C 16,72 26,45 38,20 Q 45,8 48,0 C 48,0 45,28 35,52 C 27,70 24,92 24,92 Z" fill="url(#goldGradient)"/>
      <path d="M 0,92 C 4,75 14,52 24,32 C 30,20 38,8 42,0 C 42,0 37,25 29,48 C 21,68 12,92 12,92 Z" fill="url(#goldGradient)"/>
      
      <!-- Right Folded Palm -->
      <path d="M 84,92 C 80,72 70,45 58,20 Q 51,8 48,0 C 48,0 51,28 61,52 C 69,70 72,92 72,92 Z" fill="url(#goldGradient)"/>
      <path d="M 96,92 C 92,75 82,52 72,32 C 66,20 58,8 54,0 C 54,0 59,25 67,48 C 75,68 84,92 84,92 Z" fill="url(#goldGradient)"/>

      <!-- Joined Wrists Base -->
      <path d="M -4,92 Q 48,114 100,92 L 90,78 Q 48,96 6,78 Z" fill="url(#goldGradient)"/>
    </g>

    <!-- Letter M -->
    <path d="M 188,90 L 188,15 L 202,15 L 226,65 L 250,15 L 264,15 L 264,90 L 252,90 L 252,35 L 231,80 L 221,80 L 200,35 L 200,90 Z" fill="url(#goldGradient)"/>

    <!-- Letter A -->
    <path d="M 276,90 L 311,15 L 326,15 L 361,90 L 346,90 L 337,70 L 300,70 L 291,90 Z M 305,58 L 332,58 L 318.5,28 Z" fill="url(#goldGradient)"/>

    <!-- Letter H -->
    <path d="M 374,90 L 374,15 L 388,15 L 388,45 L 434,45 L 434,15 L 448,15 L 448,90 L 434,90 L 434,57 L 388,57 L 388,90 Z" fill="url(#goldGradient)"/>

    <!-- Letter A -->
    <path d="M 462,90 L 497,15 L 512,15 L 547,90 L 532,90 L 523,70 L 486,70 L 477,90 Z M 491,58 L 518,58 L 504.5,28 Z" fill="url(#goldGradient)"/>

    <!-- Letter A -->
    <path d="M 552,90 L 587,15 L 602,15 L 637,90 L 622,90 L 613,70 L 576,70 L 567,90 Z M 581,58 L 608,58 L 594.5,28 Z" fill="url(#goldGradient)"/>

    <!-- Signature Horizontal Gold Cross Line Passing Through M A H A A -->
    <line x1="235" y1="52" x2="655" y2="52" stroke="url(#goldGradient)" stroke-width="3.5"/>

    <!-- Subtitle: TIFFIN ROOM -->
    <text x="342" y="142" font-family="'Cormorant Garamond', 'Cinzel', 'Trajan Pro', Georgia, serif" font-size="34" font-weight="700" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="10" filter="url(#goldDropShadow)">
      TIFFIN ROOM
    </text>

  </g>
</svg>
