<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B027"/>
      <stop offset="50%" stop-color="#E6A12A"/>
      <stop offset="100%" stop-color="#D98A00"/>
    </linearGradient>
    <filter id="goldDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#F5B027" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Deep Emerald Green Background Box -->
  <rect x="0" y="0" width="800" height="240" fill="#002E2B"/>

  <!-- Outer Solid Golden Border -->
  <rect x="10" y="10" width="780" height="220" fill="none" stroke="url(#goldGradient)" stroke-width="12"/>

  <!-- Top Right "PURE VEG" Text -->
  <text x="765" y="42" font-family="'Outfit', 'Montserrat', 'Helvetica', sans-serif" font-size="13" font-weight="900" fill="url(#goldGradient)" text-anchor="end" letter-spacing="2.5">
    PURE VEG
  </text>

  <!-- Main Banner Brand Logo Group (Centered at x=400) -->
  <g transform="translate(67, 58)">
    
    <!-- Letter N -->
    <path d="M 0,90 L 0,15 L 14,15 L 62,76 L 62,15 L 76,15 L 76,90 L 62,90 L 14,29 L 14,90 Z" fill="url(#goldGradient)"/>

    <!-- Letter A (Normal Clean Letter A) -->
    <path d="M 90,90 L 126,15 L 142,15 L 178,90 L 162,90 L 153,70 L 115,70 L 106,90 Z M 120,56 L 148,56 L 134,26 Z" fill="url(#goldGradient)"/>

    <!-- Letter M -->
    <path d="M 192,90 L 192,15 L 208,15 L 232,65 L 256,15 L 272,15 L 272,90 L 258,90 L 258,35 L 237,80 L 227,80 L 206,35 L 206,90 Z" fill="url(#goldGradient)"/>

    <!-- Letter A (Normal Clean Letter A) -->
    <path d="M 286,90 L 322,15 L 338,15 L 374,90 L 358,90 L 349,70 L 311,70 L 302,90 Z M 316,56 L 344,56 L 330,26 Z" fill="url(#goldGradient)"/>

    <!-- Letter H -->
    <path d="M 388,90 L 388,15 L 402,15 L 402,45 L 448,45 L 448,15 L 462,15 L 462,90 L 448,90 L 448,59 L 402,59 L 402,90 Z" fill="url(#goldGradient)"/>

    <!-- Letter A (Normal Clean Letter A) -->
    <path d="M 476,90 L 512,15 L 528,15 L 564,90 L 548,90 L 539,70 L 501,70 L 492,90 Z M 506,56 L 534,56 L 520,26 Z" fill="url(#goldGradient)"/>

    <!-- Letter A (Normal Clean Letter A) -->
    <path d="M 578,90 L 614,15 L 630,15 L 666,90 L 650,90 L 641,70 L 603,70 L 594,90 Z M 608,56 L 636,56 L 622,26 Z" fill="url(#goldGradient)"/>

    <!-- Signature Horizontal Gold Line -->
    <line x1="20" y1="56" x2="646" y2="56" stroke="url(#goldGradient)" stroke-width="3"/>

    <!-- Subtitle: TIFFIN ROOM -->
    <text x="333" y="140" font-family="'Cormorant Garamond', 'Cinzel', 'Trajan Pro', Georgia, serif" font-size="34" font-weight="700" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="10" filter="url(#goldDropShadow)">
      TIFFIN ROOM
    </text>

  </g>
</svg>
