<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradOfficial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7B733"/>
      <stop offset="50%" stop-color="#E6A12A"/>
      <stop offset="100%" stop-color="#C7881E"/>
    </linearGradient>
    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#F7B733" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Solid Background Card with Official Outer Border -->
  <rect x="6" y="6" width="588" height="188" fill="#023933" rx="4"/>
  <rect x="6" y="6" width="588" height="188" fill="none" stroke="url(#goldGradOfficial)" stroke-width="7" rx="4"/>
  
  <!-- PURE VEG in Top Right -->
  <text x="566" y="32" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="url(#goldGradOfficial)" text-anchor="end" letter-spacing="2">
    PURE VEG
  </text>

  <!-- Official Logo Graphic Group - Balanced Compressed Proportions -->
  <g transform="translate(45, 38)">
    
    <!-- Letter N -->
    <path d="M 10,75 L 10,15 L 17,15 L 45,65 L 45,15 L 53,15 L 53,75 L 46,75 L 18,25 L 18,75 Z" fill="url(#goldGradOfficial)"/>

    <!-- Stylized Namaste Icon (Represents 'A') -->
    <g transform="translate(62, 10)">
      <!-- Left Hand -->
      <path d="M 5,65 C 2,45 8,25 18,10 C 22,5 26,0 28,-5 C 28,-5 23,20 20,35 C 16,50 14,65 14,65 Z" fill="url(#goldGradOfficial)"/>
      <path d="M -2,65 C -4,50 2,35 10,20 C 14,12 18,5 20,0 C 20,0 16,22 13,37 C 10,50 7,65 7,65 Z" fill="url(#goldGradOfficial)"/>
      <!-- Right Hand -->
      <path d="M 51,65 C 54,45 48,25 38,10 C 34,5 30,0 28,-5 C 28,-5 33,20 36,35 C 40,50 42,65 42,65 Z" fill="url(#goldGradOfficial)"/>
      <path d="M 58,65 C 60,50 54,35 46,20 C 42,12 38,5 36,0 C 36,0 40,22 43,37 C 46,50 49,65 49,65 Z" fill="url(#goldGradOfficial)"/>
      <!-- Base Wrist -->
      <path d="M -5,65 Q 28,82 61,65 L 53,78 Q 28,92 3,78 Z" fill="url(#goldGradOfficial)"/>
    </g>

    <!-- Letter M -->
    <path d="M 130,75 L 130,15 L 140,15 L 158,55 L 176,15 L 186,15 L 186,75 L 177,75 L 177,30 L 162,65 L 154,65 L 139,30 L 139,75 Z" fill="url(#goldGradOfficial)"/>

    <!-- Letter A (1) -->
    <path d="M 200,75 L 225,15 L 235,15 L 260,75 L 250,75 L 243,58 L 217,58 L 210,75 Z M 220,50 L 240,50 L 230,24 Z" fill="url(#goldGradOfficial)"/>

    <!-- Letter H -->
    <path d="M 270,75 L 270,15 L 279,15 L 279,40 L 311,40 L 311,15 L 320,15 L 320,75 L 311,75 L 311,48 L 279,48 L 279,75 Z" fill="url(#goldGradOfficial)"/>

    <!-- Letter A (2) -->
    <path d="M 330,75 L 355,15 L 365,15 L 390,75 L 380,75 L 373,58 L 347,58 L 340,75 Z M 350,50 L 370,50 L 360,24 Z" fill="url(#goldGradOfficial)"/>

    <!-- Letter A (3) -->
    <path d="M 400,75 L 425,15 L 435,15 L 460,75 L 450,75 L 443,58 L 417,58 L 410,75 Z M 420,50 L 440,50 L 430,24 Z" fill="url(#goldGradOfficial)"/>

    <!-- Signature Continuous Horizontal Cross Line Through A H A A -->
    <line x1="175" y1="46" x2="485" y2="46" stroke="url(#goldGradOfficial)" stroke-width="3"/>

    <!-- Subtitle: TIFFIN ROOM -->
    <text x="250" y="112" font-family="'Cormorant Garamond', 'Cinzel', Georgia, serif" font-size="28" font-weight="700" fill="url(#goldGradOfficial)" text-anchor="middle" letter-spacing="8" filter="url(#goldGlow)">
      TIFFIN ROOM
    </text>

  </g>
</svg>
